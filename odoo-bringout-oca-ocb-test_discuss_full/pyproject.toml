[project]
name = "odoo-bringout-oca-ocb-test_discuss_full"
version = "16.0.0"
description = "Test Discuss (full) - 
        Test of Discuss with all possible overrides installed.
        "
authors = [
    { name = "Ernad Husremovic", email = "hernad@bring.out.ba" }
]
dependencies = [
    "odoo-bringout-oca-ocb-calendar>=18.0.0",
    "odoo-bringout-oca-ocb-crm>=18.0.0",
    "odoo-bringout-oca-ocb-crm_livechat>=18.0.0",
    "odoo-bringout-oca-ocb-hr_attendance>=18.0.0",
    "odoo-bringout-oca-ocb-hr_fleet>=18.0.0",
    "odoo-bringout-oca-ocb-hr_holidays>=18.0.0",
    "TODO_MAP-hr_homeworking>=18.0.0",
    "odoo-bringout-oca-ocb-im_livechat>=18.0.0",
    "odoo-bringout-oca-ocb-mail>=18.0.0",
    "odoo-bringout-oca-ocb-mail_bot>=18.0.0",
    "TODO_MAP-project_todo>=18.0.0",
    "odoo-bringout-oca-ocb-website_livechat>=18.0.0",
    "odoo-bringout-oca-ocb-website_slides>=18.0.0",
    "requests>=2.25.1"
]
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
homepage = "https://git.hodi.ba/bringout/project-0"
repository = "https://git.hodi.ba/bringout/project-0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["test_discuss_full"]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.4.1",
]
